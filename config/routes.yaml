controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Routes Enseignant
app_enseignant_emploi_du_temps:
    path: /enseignant/emploi-du-temps
    controller: App\Controller\EnseignantEmploiDuTempsController::index
    methods: [GET]

enseignant_emploi_du_temps_semaine:
    path: /enseignant/emploi-du-temps/semaine
    controller: App\Controller\EnseignantEmploiDuTempsController::semaine
    methods: [GET]

enseignant_emploi_du_temps_filiere:
    path: /enseignant/emploi-du-temps/filiere/{filiereId}
    controller: App\Controller\EnseignantEmploiDuTempsController::byFiliere
    methods: [GET]

enseignant_emploi_du_temps_export:
    path: /enseignant/emploi-du-temps/export
    controller: App\Controller\EnseignantEmploiDuTempsController::export
    methods: [GET]

app_enseignant_mes_filieres:
    path: /enseignant/mes-filieres
    controller: App\Controller\EnseignantController::mesFilieres
    methods: [GET]

app_enseignant_filiere_etudiants:
    path: /enseignant/filiere/{id}/etudiants
    controller: App\Controller\EnseignantController::listeEtudiants
    methods: [GET]

# Routes Profil et Paramètres
app_profil:
    path: /profil
    controller: App\Controller\ProfilController::index
    methods: [GET]

app_profil_modifier:
    path: /profil/modifier
    controller: App\Controller\ProfilController::modifier
    methods: [GET, POST]

app_profil_modifier_specifique:
    path: /profil/modifier-profil-specifique
    controller: App\Controller\ProfilController::modifierProfilSpecifique
    methods: [GET, POST]

app_profil_supprimer_compte:
    path: /profil/supprimer-compte
    controller: App\Controller\ProfilController::supprimerCompte
    methods: [POST]

app_profil_statistiques:
    path: /profil/statistiques
    controller: App\Controller\ProfilController::statistiques
    methods: [GET]

app_parametres:
    path: /parametres
    controller: App\Controller\ParametresController::index
    methods: [GET]

app_parametres_modifier:
    path: /parametres/modifier
    controller: App\Controller\ParametresController::modifier
    methods: [POST]

app_parametres_securite:
    path: /parametres/securite
    controller: App\Controller\ParametresController::securite
    methods: [GET]

app_parametres_notifications:
    path: /parametres/notifications
    controller: App\Controller\ParametresController::notifications
    methods: [GET]

app_parametres_confidentialite:
    path: /parametres/confidentialite
    controller: App\Controller\ParametresController::confidentialite
    methods: [GET]

app_parametres_aide:
    path: /parametres/aide
    controller: App\Controller\ParametresController::aide
    methods: [GET]

# Routes Étudiant
etudiant_dashboard:
    path: /etudiant/dashboard
    controller: App\Controller\EtudiantController::dashboard
    methods: [GET]

etudiant_cours_index:
    path: /etudiant/cours
    controller: App\Controller\EtudiantController::coursIndex
    methods: [GET]

etudiant_cours_show:
    path: /etudiant/cours/{id}
    controller: App\Controller\EtudiantController::coursShow
    methods: [GET]

etudiant_chapitre_show:
    path: /etudiant/chapitre/{id}
    controller: App\Controller\EtudiantController::chapitreShow
    methods: [GET]

etudiant_notes_index:
    path: /etudiant/notes
    controller: App\Controller\EtudiantController::notesIndex
    methods: [GET]

etudiant_emploi_du_temps:
    path: /etudiant/emploi-du-temps
    controller: App\Controller\EtudiantController::emploiDuTemps
    methods: [GET]

etudiant_piece_jointe_download:
    path: /etudiant/piece-jointe/{id}/download
    controller: App\Controller\EtudiantController::downloadPieceJointe
    methods: [GET]

etudiant_evaluations_index:
    path: /etudiant/evaluations
    controller: App\Controller\EtudiantController::evaluationsIndex
    methods: [GET]

# Routes de test
admin_emploi_du_temps_test_data:
    path: /admin/emploi-du-temps/test-data
    controller: App\Controller\AdminEmploiDuTempsController::testData
    methods: [GET]

etudiant_test_emploi_du_temps:
    path: /etudiant/test-emploi-du-temps
    controller: App\Controller\EtudiantController::testEmploiDuTemps
    methods: [GET]
